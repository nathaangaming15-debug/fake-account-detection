<!DOCTYPE html>
<html>
<head>
    <title>Fake Account Detector</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; color: #222; }
        h2 { margin-bottom: 4px; }
        p.subtitle { color: #666; margin-top: 0; }
        label { font-weight: 600; font-size: 0.9em; }
        input, select { width: 100%; padding: 8px; margin: 4px 0 14px 0; box-sizing: border-box;
                border: 1px solid #ccc; border-radius: 4px; }
        button { background: #2563eb; color: white; border: none; padding: 10px 20px;
                 border-radius: 4px; font-size: 1em; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        .result { margin-top: 24px; padding: 16px; border-radius: 6px; }
        .result.fake { background: #fef2f2; border: 1px solid #fecaca; }
        .result.real { background: #f0fdf4; border: 1px solid #bbf7d0; }
    </style>
</head>
<body>
    <h2>Fake Account Detection</h2>
    <p class="subtitle">Enter account details to estimate whether it's fake or genuine.</p>
    <form method="POST">
        <label>Followers Count</label>
        <input type="number" name="followers" required>

        <label>Following Count</label>
        <input type="number" name="follows" required>

        <label>Has Profile Pic?</label>
        <select name="profile_pic">
            <option value="1">Yes</option>
            <option value="0">No</option>
        </select>

        <label>Bio/Description Length (characters)</label>
        <input type="number" name="description_length" required>

        <label>Has External URL?</label>
        <select name="external_url">
            <option value="0">No</option>
            <option value="1">Yes</option>
        </select>

        <label>Private Account?</label>
        <select name="private">
            <option value="0">No</option>
            <option value="1">Yes</option>
        </select>

        <label>Number of Posts</label>
        <input type="number" name="posts" required>

        <label>Username Digit Ratio (0 to 1, e.g. "user829" = 0.375)</label>
        <input type="number" step="0.01" min="0" max="1" name="username_digit_ratio" required>

        <label>Full Name Digit Ratio (0 to 1)</label>
        <input type="number" step="0.01" min="0" max="1" name="fullname_digit_ratio" required>

        <label>Full Name Word Count</label>
        <input type="number" name="fullname_word_count" required>

        <label>Full Name Equals Username?</label>
        <select name="name_equals_username">
            <option value="0">No</option>
            <option value="1">Yes</option>
        </select>

        <button type="submit">Predict</button>
    </form>

    {% if result %}
        <div class="result {{ 'fake' if result == 'Fake' else 'real' }}">
            <h3>Prediction: {{ result }}</h3>
            <p>Model confidence this account is fake: {{ confidence }}%</p>
        </div>
    {% endif %}
</body>
</html>
